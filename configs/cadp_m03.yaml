seed: 42

# CADP M03 — LSTM Temporal Follower (v5_recurrent replica)
# Audio: 20fps MERT (768-dim), pooled to 20 chunks, then BiLSTM
# Score: DINOv2 columns (80px, stride 40px), mean-pooled patches
# Task:  sim matrix + expected_distance loss + DTW decode
# Expected on MSMD test: ~33% @ 0.5s (matches v5m_big)

model:
  mert_dim:           768
  dinov2_dim:         768
  embed_dim:          256
  n_audio_chunks:     20
  lstm_hidden:        512
  lstm_layers:        2
  lstm_bidirectional: true

data:
  processed_root: data/MSMD/processed
  mert_root:      data/MSMD/mert_emb
  dinov2_root:    data/MSMD/dinov2_emb
  fps:            20.0

loss:
  temperature:     0.07
  power:           1.0
  entropy_weight:  0.0

optim:
  lr:           5.0e-4
  weight_decay: 0.0
  patience:     5

train:
  max_epochs: 40
  win_sec:    5.0
  out_dir:    results/cadp_m03

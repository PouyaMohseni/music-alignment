seed: 42

# v9 — CPJKU ConditionalUNet with their EXACT best-model config (CB_TA).
# Network code copied verbatim from CPJKU/audio_conditioned_unet (ismir-2020).
# Spectrogram: sr=22050, fps=20, 78-bin log-mel (madmom-free via librosa).

# Their net_config for CB_TA (best model, 85.2% @0.5s):
net:
  film_layers:      [2, 3, 4, 5, 6, 7, 8]
  n_encoder_layers: 4
  n_filters_start:  8
  rnn_size:         128
  rnn_layer:        1
  use_lstm:         true
  audio_encoder:    CBEncoder
  spec_enc:         32

data:
  processed_root: data/MSMD/processed
  tile_width:     512    # score crop width (pixels)
  h_strip:        128    # strip height after resize (power of 2 for U-Net)
  n_mels:         78     # spectrogram frequency bins
  fps:            20     # spectrogram frame rate (matches their fps=20)
  n_frames:       40     # CBEncoder context window (40 frames = 2s at fps=20)
  gt_width:       10     # binary GT rectangle width (their gt_width=10)
  batch_size:     16
  num_workers:    4

optim:
  lr:           1.0e-4   # their learning rate
  weight_decay: 1.0e-5   # their weight decay
  patience:     5        # ReduceLROnPlateau patience
  clip_grads:   null

train:
  steps:      50000
  log_every:  100
  eval_every: 5000
  ckpt_every: 5000
  out_dir:    results/v9_cpjku

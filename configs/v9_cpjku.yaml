seed: 42

# v9 — Faithful Henkel ISMIR 2020 (CPJKU) reimplementation.
# 2D U-Net on full strip crops (H × W) preserving the pitch axis.
# Always-centered crop during training (faithful to paper) — works here
# because the 2D pitch structure gives FiLM something to discriminate on.
#
# PREREQUISITE: audio.wav in each piece directory.
# If missing: python -m msmd_prep.run_all --stage synth --processed data/MSMD/processed

data:
  processed_root: data/MSMD/processed
  window_sec:     5.0
  sr:             24000
  hop:            512        # eff_hz ≈ 46.875 Hz
  sigma_x:        25.0       # 2D Gaussian x-sigma (strip width direction)
  sigma_y:        10.0       # 2D Gaussian y-sigma (strip height direction)
  batch_size:     8
  num_workers:    4

model:
  n_bins:           78
  cnn_channels:     [32, 64, 128]
  lstm_hidden:      256
  lstm_layers:      2
  lstm_bidirectional: false
  unet_channels:    [32, 64, 128, 256]
  h_strip:          128      # strip height after resize (power of 2 for U-Net)
  tile_width:       512

optim:
  lr:           1.0e-3
  weight_decay: 0.0
  warmup_steps: 500
  grad_clip:    1.0

train:
  steps:        30000
  log_every:    50
  eval_every:   5000
  ckpt_every:   5000
  out_dir:      results/v9_cpjku

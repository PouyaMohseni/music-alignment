seed: 42

init_v3_checkpoint: null

data:
  emb_root:        /lustre07/scratch/pmohseni/music-alignment/data/MSMD/embeddings_all_tar
  processed_root:  data/MSMD/processed_all
  num_workers:     2

model:
  d_audio:        768
  d_image:        768
  shared_dim:     256
  n_heads:        4
  n_cross_layers: 0      # no cross-attention — LSTM only, simpler model
  dropout:        0.1
  lstm_hidden:    256
  lstm_layers:    1

optim:
  lr:           2.0e-4   # slightly higher lr since training from scratch (no warm-start)
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip:    1.0

train:
  steps:            8000
  grad_accum_steps: 8
  log_every:        10
  eval_every:       500
  ckpt_every:       2000
  out_dir:          results/v5c_noxattn

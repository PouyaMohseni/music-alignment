seed: 42

# Warm-start: set via CLI override  init_v3_checkpoint=results/v3_all/checkpoint_XXXXXX.pt
init_v3_checkpoint: null

data:
  emb_root:        /lustre07/scratch/pmohseni/music-alignment/data/MSMD/embeddings_all_tar
  processed_root:  data/MSMD/processed_all
  num_workers:     2
  tile_size:       224

model:
  d_audio:          768
  d_image:          768
  shared_dim:       256
  n_heads:          4
  n_cross_layers:   1
  dropout:          0.1
  pitch_fuse_alpha: 0.2      # gentle — pitch at ~20% weight; v4 had 1.0 (too aggressive)
  pitch_hidden:     256

loss:
  temperature:    0.07       # same as v3 (v4's 0.03 was too sharp from scratch)
  power:          1.0        # same as v3 (only change one thing at a time)
  entropy_weight: 0.0
  pitch_weight:   0.3        # gentle aux supervision

optim:
  lr:           1.0e-4       # lower than v4 (0.3e-3) — warm-started weights need smaller steps
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip:    1.0

train:
  steps:            8000
  grad_accum_steps: 8
  log_every:        10
  eval_every:       500
  ckpt_every:       2000
  out_dir:          results/v4b_pitch

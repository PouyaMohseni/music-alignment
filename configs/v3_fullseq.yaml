seed: 42

# --- encoder settings (used only by precompute.py) ---
audio_model_id:  m-a-p/MERT-v1-95M
image_model_id:  google/vit-base-patch16-224-in21k
audio_sr:        24000
pool_hz:         10
tile_size:       224
tile_stride:     56

data:
  emb_root:        data/MSMD/embeddings
  processed_root:  data/MSMD/processed
  num_workers:     2

model:
  d_audio:        768     # MERT-v1-95M hidden size
  d_image:        768     # ViT-base hidden size
  shared_dim:     256
  n_heads:        4
  n_cross_layers: 1       # 0 = pure projection (ablation), 1+ = cross-attention
  dropout:        0.1

loss:
  temperature:    0.07    # softmax temperature on cosine sim
  power:          1.0     # 1.0 = L1 distance penalty, 2.0 = squared
  entropy_weight: 0.0     # >0 to discourage uniform distributions

optim:
  lr:           3.0e-4    # higher than v1/v2 — only a tiny head trains
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip:    1.0

train:
  steps:            10000
  grad_accum_steps: 8     # effective batch = 8 full pieces
  log_every:        10
  eval_every:       500
  ckpt_every:       2000
  out_dir:          results/v3_fullseq

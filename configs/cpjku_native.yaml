# Config for CPJKU native train_model.py / eval_model.py on our MSMD strips.
#
# real_perf: true  → uses audio.wav for spectrogram (not MIDI synthesis)
# tempo_factors: [1000]  → looks for performance/<piece>_1000.wav
#   (these are symlinks created by convert.py → our audio.wav)
# sf_path: ''  → soundfont not needed when real_perf=true

spectrogram_params:
  sample_rate: 22050
  frame_size: 2048
  fps: 20
  pad: 40

gt_width: 10
real_perf: true
tempo_factors:
  - 1000
sf_path: ''

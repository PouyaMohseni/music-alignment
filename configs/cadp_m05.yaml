seed: 42

# CADP M05 — Learned Path Predictor
# Replaces DTW decode (M01/M03's failure mode on tempo drift/repeats) with a
# learned per-frame predictor: axial-attention over the dense M04 sim matrix,
# then soft-argmax over score positions. No global monotonic path to break.

model:
  mert_dim:         768
  dinov2_dim:       768
  hidden_dim:       512
  embed_dim:        256
  path_channels:    128
  attention_heads:  4
  # Axial self-attention over score positions costs O(T_a * N_s^2). Median
  # piece has N_cols~207 (N_s~828); some reach 1300+ (N_s~5200), which OOMs
  # a 40GB A100. Cap columns seen per training/eval step; see m05_train.py
  # and m05_eval.py for how wider pieces are cropped/scanned around this cap.
  max_n_cols:       120

data:
  processed_root: data/MSMD/processed
  mert_root:      data/MSMD/mert_emb
  dinov2_root:    data/MSMD/dinov2_emb
  fps:            20.0

loss:
  temperature:     0.5
  power:           1.0
  entropy_weight:  0.0

optim:
  lr:           3.0e-4
  weight_decay: 0.0
  patience:     5

train:
  max_epochs: 50
  win_sec:    5.0
  out_dir:    results/cadp_m05

seed: 42

data:
  manifest_path: data/MSMD/processed/manifest.jsonl
  num_workers:   0       # 0 for laptop debugging; bump to 4+ on a GPU box

window:
  audio_sec:        5.0
  audio_sr:         24000
  pool_hz:          10
  tile_size:        224
  tile_stride:      56
  margin_sec_range: [3.0, 8.0]
  min_anchors:      3
  max_retries:      10

model:
  shared_dim:     256
  audio_model_id: m-a-p/MERT-v1-95M
  image_model_id: google/vit-base-patch16-224-in21k
  pool_hz:        10
  tile_size:      224
  tile_stride:    56
  freeze_audio:   true
  freeze_image:   true
  head_dropout:   0.0

loss:
  gamma:             1.0    # 0.1 caused exp underflow in fp16 → NaN; 1.0 is numerically stable
  anchor_weight:     1.0
  band_radius_frac:  0.5

optim:
  lr:           1.0e-4     # 3e-4 was too aggressive for projection-heads-only training
  weight_decay: 0.01
  warmup_steps: 1000       # longer warmup gives frozen encoder embeddings time to stabilise
  grad_clip:    0.5        # tighter clip; SoftDTW gradients can spike early

train:
  batch_size:      16
  steps:           20000
  log_every:       10
  eval_every:      500
  ckpt_every:      2000
  amp:             false   # disabled: pure-Python SoftDTW + fp16 → NaN; re-enable only with CUDA kernel
  device:          auto
  out_dir:         results/v1_baseline
